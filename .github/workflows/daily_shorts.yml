# ================================================================
# Daily Shorts Pipeline
# ================================================================
# [변경 이력]
# 2026.05.13 최초 작성 — 매일 쇼츠 독립 업로드
# ================================================================

name: Daily Shorts Pipeline

on:
  schedule:
    # 금요일 오전 9시 KST (= UTC 00:00) 실행 → 토요일 18:30 KST 예약 공개
    # 만다라 숏폼(월·화·목·금), 자연롱폼 숏폼(수·일) 제외 → 토요일만 공백
    - cron: '0 0 * * 5'
  workflow_dispatch:  # 수동 실행 버튼 (테스트용)

jobs:
  run-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 음원 수집 지연 대비 여유 확보

    steps:
      # ── 1. 코드 체크아웃 ──────────────────────────────────────────
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master

      # ── 2. data 브랜치에서 데이터 파일 가져오기 ─────────────────────
      - name: Fetch data files
        run: |
          git fetch origin data 2>/dev/null || echo "data 브랜치 없음 — 첫 실행"
          if git show origin/data:used_assets.json > used_assets.json 2>/dev/null; then
            echo "used_assets.json 복원됨"
          else
            echo "used_assets.json 없음 — 새로 시작"
          fi
          if git show origin/data:history.txt > history.txt 2>/dev/null; then
            echo "history.txt 복원됨"
          else
            echo "history.txt 없음"
          fi

      # ── 3. 복호화 (비활성화 — 평문 저장) ────────────────────────────
      - name: Decrypt data files
        run: |
          : # 암호화 비활성화 — data 브랜치에 평문으로 저장
          # pip install cryptography python-dotenv --quiet
          # if [ -f used_assets.json.enc ]; then
          #   python crypto_utils.py --decrypt used_assets.json.enc
          # fi
          # if [ -f history.txt.enc ]; then
          #   python crypto_utils.py --decrypt history.txt.enc
          # fi

      # ── 4. Python 환경 설정 ──────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 5. FFmpeg 설치 ───────────────────────────────────────────────
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      # ── 6. rclone 설치 및 Google Drive 설정 ─────────────────────────
      - name: Install and configure rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone

          if [ -z "$RCLONE_CONF" ]; then
            echo "::error::RCLONE_CONF 시크릿이 비어 있습니다."
            exit 1
          fi

          echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

          if ! rclone listremotes | grep -q "^gdrive:"; then
            echo "::error::rclone.conf에 'gdrive' 리모트가 없습니다."
            rclone listremotes
            exit 1
          fi

          echo "rclone 설정 완료 — gdrive 리모트 확인됨"

      # ── 7. 자격증명 복원 ─────────────────────────────────────────────
      - name: Restore credentials
        env:
          YOUTUBE_TOKEN_JSON:        ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
        run: |
          mkdir -p credentials
          echo "$YOUTUBE_TOKEN_JSON"        > credentials/token.json
          echo "$GOOGLE_CLIENT_SECRET_JSON" > credentials/client_secret.json

      # ── 8. 쇼츠 파이프라인 실행 ─────────────────────────────────────
      - name: Run shorts pipeline
        env:
          FREESOUND_API_KEY:          ${{ secrets.FREESOUND_API_KEY }}
          PEXELS_API_KEY:             ${{ secrets.PEXELS_API_KEY }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          # ENCRYPTION_KEY:             ${{ secrets.ENCRYPTION_KEY }}  # 암호화 비활성화
          UPLOAD_ENABLED:             "true"
          SHORTS_UPLOAD_HOUR_KST:     "18"
          SHORTS_UPLOAD_MINUTE_KST:   "30"
          YOUTUBE_TOKEN:              "credentials/token.json"
          YOUTUBE_CLIENT_SECRET:      "credentials/client_secret.json"
        run: python shorts_pipeline.py

      # ── 9. data 브랜치에 커밋 (평문 저장) ──────────────────────────
      - name: Commit data files
        if: always()
        run: |
          if [ -f used_assets.json ]; then
            # python crypto_utils.py --encrypt used_assets.json  # 암호화 비활성화
            cp used_assets.json /tmp/used_assets.json
          fi
          if [ -f history.txt ]; then
            # python crypto_utils.py --encrypt history.txt  # 암호화 비활성화
            cp history.txt /tmp/history.txt
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin data 2>/dev/null || true
          rm -f used_assets.json history.txt
          if git ls-remote --heads origin data | grep -q data; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . --quiet 2>/dev/null || true
          fi

          [ -f /tmp/used_assets.json ] && cp /tmp/used_assets.json used_assets.json
          [ -f /tmp/history.txt ]      && cp /tmp/history.txt history.txt

          [ -f used_assets.json ] && git add used_assets.json
          [ -f history.txt ]      && git add history.txt
          [ -f blacklist.json ]   && git add blacklist.json

          TODAY=$(date -u '+%Y-%m-%d %H:%M UTC')
          git diff --cached --quiet || git commit -m "data(shorts): ${TODAY}"
          git push origin data

      # ── 10. Artifacts 저장 ───────────────────────────────────────────
      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output-${{ github.run_id }}
          path: |
            output/**/thumbnails/
            output/**/pipeline.log
            output/**/metadata.json
          retention-days: 30
          if-no-files-found: warn

      # ── 11. 민감 파일 정리 ───────────────────────────────────────────
      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -rf output/
          rm -f credentials/token.json credentials/client_secret.json
          rm -f used_assets.json history.txt
          echo "정리 완료"
